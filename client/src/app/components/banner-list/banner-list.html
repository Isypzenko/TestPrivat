<div class="list-container">
  <div class="banner-grid">
    @if (isLoading()) {
      @for (item of [1, 2, 3]; track $index) {
        <mat-card class="banner-card skeleton-card">
          <div class="skeleton-image placeholder-shimmer"></div>
          <mat-card-content>
            <div class="skeleton-line placeholder-shimmer w-70"></div>
            <div class="skeleton-line placeholder-shimmer w-40"></div>
          </mat-card-content>
          <mat-card-actions>
            <div class="skeleton-button placeholder-shimmer"></div>
            <div class="skeleton-button placeholder-shimmer"></div>
          </mat-card-actions>
        </mat-card>
      }
    } @else {
      @for (banner of banners; track banner.id) {
        <div class="card-wrapper" [animate.enter]="'banner-enter'" [animate.leave]="'banner-gone'">
          <mat-card class="banner-card">
            <img mat-card-image [src]="banner.src" alt="Banner Image" />
            <mat-card-content>
              <h3>{{ banner.title }}</h3>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button color="primary" [routerLink]="['/edit', banner.id]">
                РЕДАКТИРОВАТЬ
              </button>
              <button mat-button color="warn" (click)="onDelete(banner.id)">УДАЛИТЬ</button>
            </mat-card-actions>
          </mat-card>
        </div>
      } @empty {
        <div class="empty-state">
          <p>Баннеров пока нет. Создайте первый!</p>
          <button mat-raised-button color="primary" routerLink="/create">Создать баннер</button>
        </div>
      }
    }
  </div>

  @if (!isLoading()) {
    <mat-paginator
      class="custom-paginator"
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      [pageSizeOptions]="[3, 6, 12]"
      (page)="onPageChange($event)"
      aria-label="Виберіть сторінку"
    >
    </mat-paginator>
  }
</div>
